<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="27px" font-weight="700" text-anchor="start" fill="#172033">TAG-KG: prediction, typed evidence, and review are separate contracts</text>
<text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start" fill="#475569">The graph records evidence and provenance; the flat scorer is the only predictive rule mechanism.</text>
<rect x="35" y="100" width="645" height="330" rx="10" fill="#F8FBFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="53" y="128" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#0F4C81">A</text>
<text x="85" y="128" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#172033">Prediction path</text>
<rect x="75" y="205" width="112" height="78" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
<text x="131" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" text-anchor="middle" fill="#1D4ED8">sentence</text>
<text x="131" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">x</text>
