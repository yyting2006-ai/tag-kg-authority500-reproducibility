<line x1="332" y1="244" x2="363" y2="244" stroke="#3B82F6" stroke-width="2"/><polygon points="363,244 351,237 351,251" fill="#3B82F6"/>
<line x1="477" y1="244" x2="508" y2="244" stroke="#3B82F6" stroke-width="2"/><polygon points="508,244 496,237 496,251" fill="#3B82F6"/>
<rect x="75" y="325" width="547" height="66" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
<text x="348" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="700" text-anchor="middle" fill="#1E40AF">registered output: exact span + label + score trace</text>
<text x="348" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">Primary test: 96 unique keys | labeled R .844 | macro labeled R .701</text>
<rect x="720" y="100" width="645" height="330" rx="10" fill="#F8FFFB" stroke="#CBD5E1" stroke-width="2"/>
<text x="738" y="128" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#0F4C81">B</text>
<text x="770" y="128" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#172033">Candidate-centric typed graph</text>
<rect x="830" y="190" width="128" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
<text x="894" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#166534">Sentence</text>
<text x="894" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">468</text>
<rect x="1045" y="160" width="128" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
<text x="1109" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#166534">CandidateSpan</text>
<text x="1109" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">500</text>
<rect x="1200" y="205" width="128" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
<text x="1264" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#166534">Annotation</text>
<text x="1264" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">1,500</text>
<rect x="835" y="305" width="128" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
<text x="899" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#166534">Consensus</text>
<text x="899" y="349" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">500</text>
<rect x="1040" y="330" width="128" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
<text x="1104" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#166534">Rule</text>
<text x="1104" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">54</text>
<rect x="1210" y="320" width="128" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
<text x="1274" y="343" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#166534">Cue</text>
<text x="1274" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">37</text>
<line x1="958" y1="219" x2="1040" y2="187" stroke="#22A06B" stroke-width="2"/>
<line x1="1173" y1="187" x2="1200" y2="224" stroke="#22A06B" stroke-width="2"/>
<line x1="1045" y1="218" x2="899" y2="305" stroke="#22A06B" stroke-width="2"/>
<line x1="1104" y1="218" x2="1104" y2="330" stroke="#22A06B" stroke-width="2"/>
<line x1="1173" y1="349" x2="1208" y2="320" stroke="#22A06B" stroke-width="2"/>
<line x1="963" y1="334" x2="1040" y2="349" stroke="#22A06B" stroke-width="2"/>
<text x="1042" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" text-anchor="middle" fill="#166534">3,100 nodes | 11,110 edges | six integrity checks = 0</text>
<rect x="35" y="460" width="645" height="325" rx="10" fill="#FFFCF7" stroke="#CBD5E1" stroke-width="2"/>
<text x="53" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#0F4C81">C</text>
<text x="85" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#172033">Scoring contract</text>
<rect x="70" y="515" width="575" height="36" rx="6" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
<text x="90" y="539" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="start" fill="#9A3412">m_y = |Q(r_y) intersect U_y| / |Q(r_y)|</text>
<rect x="70" y="563" width="575" height="36" rx="6" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
<text x="90" y="587" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="start" fill="#9A3412">k_y = m_y (pi(r_y)/100 + 0.25)</text>
<rect x="70" y="611" width="575" height="36" rx="6" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
<text x="90" y="635" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="start" fill="#9A3412">S_y = log(max(P_local, 1e-6)) + alpha rho(r_y) k_y</text>
<rect x="70" y="659" width="575" height="36" rx="6" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
<text x="90" y="683" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="start" fill="#9A3412">rho(r) = (c_r + 1)/(n_r + 2) when n_r &gt; 0; else 0</text>
<text x="70" y="740" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="start" fill="#475569">Reliability is estimated on training labels only; priors and test metadata are excluded.</text>
<rect x="720" y="460" width="645" height="325" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="738" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#0F4C81">D</text>
<text x="770" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" text-anchor="start" fill="#172033">Review and release ledger</text>
<rect x="770" y="570" width="160" height="92" rx="8" fill="#DBEAFE" stroke="#94A3B8" stroke-width="2"/>
<text x="850" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="700" text-anchor="middle" fill="#172033">score</text>
<text x="850" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" text-anchor="middle" fill="#334155">q(c)=P_span</text>
<text x="850" y="646" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" text-anchor="middle" fill="#334155">x max_y P(y|c,x)</text>
<rect x="960" y="570" width="160" height="92" rx="8" fill="#DCFCE7" stroke="#94A3B8" stroke-width="2"/>
<text x="1040" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="700" text-anchor="middle" fill="#172033">route</text>
<text x="1040" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" text-anchor="middle" fill="#334155">A_tau</text>
<text x="1040" y="646" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" text-anchor="middle" fill="#334155">or teacher queue</text>
<rect x="1150" y="570" width="160" height="92" rx="8" fill="#FFEDD5" stroke="#94A3B8" stroke-width="2"/>
<text x="1230" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="700" text-anchor="middle" fill="#172033">release</text>
<text x="1230" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" text-anchor="middle" fill="#334155">version</text>
<text x="1230" y="646" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" text-anchor="middle" fill="#334155">+ hash + source</text>
<line x1="930" y1="616" x2="950" y2="616" stroke="#64748B" stroke-width="2"/><polygon points="950,616 938,609 938,623" fill="#64748B"/>
<line x1="1120" y1="616" x2="1140" y2="616" stroke="#64748B" stroke-width="2"/><polygon points="1140,616 1128,609 1128,623" fill="#64748B"/>
<text x="1042" y="718" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" fill="#334155">Every prediction points to a sentence, exact span, score vector, rule/cue trace, and data version.</text>
</svg>
