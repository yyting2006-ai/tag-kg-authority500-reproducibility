<text x="276" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" text-anchor="middle" fill="#1D4ED8">candidate</text>
<text x="276" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">c=(b,e,s)</text>
<rect x="365" y="205" width="112" height="78" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
<text x="421" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" text-anchor="middle" fill="#1D4ED8">local</text>
<text x="421" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">P(y|c,x)</text>
<rect x="510" y="205" width="112" height="78" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
<text x="566" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" text-anchor="middle" fill="#1D4ED8">rerank</text>
<text x="566" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" text-anchor="middle" fill="#334155">S_y(c)</text>
